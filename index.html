<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CF</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body>
  <section class="m-0 p-0 overflow-hidden">
    <div class="relative w-full h-screen bg-cover bg-center text-white"
      style="background-image: url('./assets/images/bg_main_section.png');">
      <!-- Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>

      <!-- Logo Section -->
      <div class="absolute top-1/4 w-full flex justify-center z-20 -translate-y-[50%]">
        <img src="./assets/images/logo_cf_main.png" alt="Crossfire Logo" class="w-[30%] max-w-[560px] h-auto">
      </div>

      <!-- Bottom Action & Social -->
      <div class="absolute bottom-16 w-full flex flex-col items-center gap-4 z-20">
        <!-- Button Group -->
        <div class="flex gap-12 mb-12">
          <a href="#" class="btn-img">
            <img src="./assets/images/btn_download.png" alt="Download" class="default-img">
            <img src="./assets/images/btn_download_hover.png" alt="Download Hover" class="hover-img">
          </a>
          <a href="#" class="btn-img">
            <img src="./assets/images/btn_register.png" alt="Register" class="default-img">
            <img src="./assets/images/btn_register_hover.png" alt="Register Hover" class="hover-img">
          </a>
        </div>

        <!-- Slogan -->
        <p class="text-[1.75rem] mt-2">SẴN SÀNG THAM CHIẾN CÙNG ĐỘT KÍCH!</p>

        <!-- Social Icons -->
        <div class="flex gap-8 mt-1">
          <a href="#"><img src="./assets/images/ic_fanpage.png" alt="Facebook"
              class="w-9 h-9 hover:scale-110 transition"></a>
          <a href="#"><img src="./assets/images/ic_instagram.png" alt="Instagram"
              class="w-9 h-9 hover:scale-110 transition"></a>
          <a href="#"><img src="./assets/images/ic_youtube.png" alt="YouTube"
              class="w-9 h-9 hover:scale-110 transition"></a>
          <a href="#"><img src="./assets/images/ic_tiktok.png" alt="TikTok"
              class="w-9 h-9 hover:scale-110 transition"></a>
          <a href="#"><img src="./assets/images/ic_discord.png" alt="Discord"
              class="w-9 h-9 hover:scale-110 transition"></a>
        </div>
      </div>
    </div>

    <!-- Floating Button (Outside Main Section) -->
    <a href="#"
      class="fixed top-1/3 right-6 z-50 w-fit h-auto flex items-center justify-center transition-transform animate-idle-float hover:animate-bounce-glow">
      <img src="./assets/images/ic_download_now.png" alt="Gift" class="w-fit mb-1">
    </a>
  </section>

  <script src="./assets/js/jquery-3.7.1.min.js"></script>
  <script src="./assets/js/main.js"></script>
</body>

</html>
